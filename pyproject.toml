[project]
name = "dat-agent"
version = "0.1.0"
description = "Dat Agent: A data assistant for PostgreSQL questions and API extraction and transformation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
]
